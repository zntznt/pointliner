<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pointliner</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fafaf8;--fg:#1a1a1a;--muted:#999;--bullet:#bbb;--bullet-h:#4a90d9;
  --cb:#bbb;--ind:24px;--lh:1.65;--font:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --hbg:#fff;--bdr:#e8e8e8;--acc:#4a90d9;--ring:rgba(74,144,217,.25);
  --cbg:#f0f0ec;--del:#999;--qbdr:rgba(74,144,217,.6);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1c1c1e;--fg:#e5e5e5;--muted:#666;--bullet:#555;--bullet-h:#5ba3e8;
  --cb:#555;--hbg:#111;--bdr:#2a2a2a;--acc:#5ba3e8;--ring:rgba(91,163,232,.25);
  --cbg:#252527;--del:#666;--qbdr:rgba(91,163,232,.5);
}}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:var(--lh);min-height:100vh}

/* toolbar */
#toolbar{position:sticky;top:0;z-index:10;background:var(--hbg);border-bottom:1px solid var(--bdr)}
#toolbar-row{padding:0 14px;height:44px;display:flex;align-items:center;gap:7px;position:relative}
.logo{font-weight:700;font-size:15px;letter-spacing:-.3px;color:var(--fg);flex-shrink:0}
.spacer{flex:1}
.file-name{font-size:12px;color:var(--muted);max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
.dirty-dot{width:7px;height:7px;border-radius:50%;background:var(--acc);display:none;flex-shrink:0}
.dirty .dirty-dot{display:block}
button{cursor:pointer;border:1px solid var(--bdr);background:transparent;color:var(--fg);font-family:inherit;font-size:12px;padding:3px 9px;border-radius:5px;transition:background .1s;white-space:nowrap;flex-shrink:0}
button:hover{background:var(--bdr)}
button.active{background:var(--acc);color:#fff;border-color:var(--acc)}
/* search — absolutely centered */
#search-wrap{position:absolute;left:50%;transform:translateX(-50%)}
#search-box{width:220px;padding:5px 12px 5px 30px;border:1px solid var(--bdr);border-radius:20px;background:var(--bg);color:var(--fg);font:inherit;font-size:13px;outline:none;transition:border-color .15s,box-shadow .15s}
#search-box:focus{border-color:var(--acc);box-shadow:0 0 0 2px var(--ring)}
#search-box::placeholder{color:var(--muted)}
#search-wrap::before{content:'⌕';position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
#search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);cursor:pointer;color:var(--muted);font-size:14px;display:none;line-height:1;border:none;background:transparent;padding:0}
#search-clear.on{display:block}
/* breadcrumb */
#breadcrumb-row{display:none;padding:5px 16px;border-top:1px solid var(--bdr);font-size:12px;flex-wrap:wrap;align-items:center;gap:4px;background:var(--hbg)}
#breadcrumb-row.visible{display:flex}
.crumb{color:var(--muted);cursor:pointer;border-radius:3px;padding:1px 4px;white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis}
.crumb:hover{color:var(--acc)}
.crumb.current{color:var(--fg);font-weight:500;cursor:default}
.crumb-sep{color:var(--muted);user-select:none;font-size:11px}

/* outline */
#outline{max-width:760px;margin:0 auto;padding:28px 24px 120px}
.zoom-title{font-size:22px;font-weight:700;letter-spacing:-.4px;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--bdr);outline:none;word-break:break-word;white-space:pre-wrap;cursor:text}
.zoom-title:empty::before{content:'(untitled)';color:var(--muted);font-style:italic;font-weight:400;pointer-events:none}
.zoom-title:focus{box-shadow:0 0 0 2px var(--ring);border-radius:3px}

/* node base */
.node{position:relative}
.node-row{display:flex;align-items:flex-start;padding:1px 0}
.collapse-btn{width:16px;height:26px;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--cb);font-size:9px;user-select:none;visibility:hidden}
.has-children>.node-row>.collapse-btn{visibility:visible}
.collapse-btn:hover{color:var(--acc)}

/* bullet area — dot + optional checkbox */
.bullet{display:flex;align-items:center;gap:4px;height:26px;padding:0 2px;cursor:pointer;flex-shrink:0}
.bullet-dot{width:6px;height:6px;border-radius:50%;background:var(--bullet);flex-shrink:0;transition:background .12s,transform .12s}
.bullet:hover .bullet-dot{background:var(--bullet-h);transform:scale(1.3)}
.node-checkbox{width:13px;height:13px;cursor:pointer;accent-color:var(--acc);flex-shrink:0}

/* node content */
.node-content{flex:1;min-width:0;outline:none;word-break:break-word;line-height:var(--lh);padding:1px 3px;border-radius:3px;white-space:pre-wrap}
.node-content:focus{box-shadow:0 0 0 2px var(--ring)}
.node-content:empty::before{content:attr(data-ph);color:var(--muted);pointer-events:none}
.node-content strong{font-weight:700}
.node-content em{font-style:italic}
.node-content u{text-decoration:underline}
.node-content code{font-family:monospace;font-size:.88em;background:var(--cbg);padding:1px 5px;border-radius:3px}
.node-content del{text-decoration:line-through;color:var(--del)}
.node-content a{color:var(--acc);text-decoration:none}
.node-content a:hover{text-decoration:underline}
.nc-italic .node-content{font-style:italic}
.nc-underline .node-content{text-decoration:underline}

/* node types */
.nt-h1>.node-row>.node-content{font-size:1.55em;font-weight:800;line-height:1.25;padding-top:3px}
.nt-h2>.node-row>.node-content{font-size:1.22em;font-weight:700;line-height:1.3}
.nt-h3>.node-row>.node-content{font-size:1.06em;font-weight:600}
.nt-h1>.node-row>.bullet .bullet-dot,.nt-h2>.node-row>.bullet .bullet-dot,.nt-h3>.node-row>.bullet .bullet-dot,
.nt-p>.node-row>.bullet .bullet-dot{opacity:.25}
/* quote */
.nt-quote>.node-row{border-left:3px solid var(--qbdr);padding-left:10px;margin-left:4px}
.nt-quote>.node-row>.node-content{color:var(--muted);font-style:italic}
.nt-quote>.node-row>.bullet .bullet-dot{display:none}
/* code block */
.nt-code>.node-row>.node-content{font-family:monospace;font-size:.88em;background:var(--cbg);padding:3px 10px;border-radius:5px;white-space:pre;overflow-x:auto}
.nt-code>.node-row>.bullet .bullet-dot{opacity:.2}
/* divider */
.nt-divider>.node-row{padding:8px 0;cursor:default}
.nt-divider>.node-row::after{content:'';display:block;height:1px;background:var(--bdr);flex:1;align-self:center}
.nt-divider>.node-row>.collapse-btn,.nt-divider>.node-row>.node-content{display:none}
.nt-divider>.node-row>.bullet{cursor:pointer}
.nt-divider>.node-row>.bullet .bullet-dot{opacity:.4}
/* ol number */
.ol-num{color:var(--muted);font-size:.88em;min-width:22px;text-align:right;padding-right:4px;flex-shrink:0;user-select:none}
/* todo checked */
.nt-todo.checked>.node-row>.node-content{text-decoration:line-through;opacity:.45}

.children{padding-left:var(--ind)}
.collapsed>.children{display:none}

/* search highlight */
mark{background:rgba(255,200,0,.38);color:inherit;border-radius:2px;padding:0 1px}
@media(prefers-color-scheme:dark){mark{background:rgba(200,150,0,.35)}}
.search-ctx{opacity:.5}
.search-ctx .node-content{pointer-events:none}

/* unified command item */
.cmd-item{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:6px;cursor:pointer}
.cmd-item:hover,.cmd-item.hi{background:var(--bdr)}
.cmd-icon{width:26px;height:26px;border-radius:6px;background:var(--bdr);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;color:var(--fg);font-family:monospace}
.cmd-icon.accent{background:var(--acc);color:#fff}
.cmd-info{display:flex;flex-direction:column;gap:1px;min-width:0}
.cmd-label{font-size:13px;font-weight:500;line-height:1.2}
.cmd-desc{font-size:11px;color:var(--muted)}
.cmd-sep{height:1px;background:var(--bdr);margin:3px 6px}

/* selection toolbar (dark floating) */
#sel-tb{position:fixed;display:none;z-index:600;background:#1e1e1e;border-radius:8px;padding:4px;gap:2px;align-items:center;box-shadow:0 4px 20px rgba(0,0,0,.4);transform:translateX(-50%)}
#sel-tb.on{display:flex}
#sel-tb .cmd-item{padding:4px 7px;border-radius:5px}
#sel-tb .cmd-item:hover{background:rgba(255,255,255,.12)}
#sel-tb .cmd-icon{background:transparent;color:#ddd;width:22px;height:22px;font-size:11px}
#sel-tb .cmd-sep{width:1px;height:16px;background:rgba(255,255,255,.15);margin:0 2px}

/* bullet popup */
#bpop{position:fixed;display:none;z-index:500;background:var(--hbg);border:1px solid var(--bdr);border-radius:10px;padding:5px;box-shadow:0 4px 24px rgba(0,0,0,.12);min-width:200px}
#bpop.on{display:block}
.bpop-types{display:flex;gap:3px;padding:4px 4px 6px;flex-wrap:wrap;border-bottom:1px solid var(--bdr);margin-bottom:3px}
.bpop-type{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;font-weight:700;color:var(--muted);font-family:monospace;transition:background .1s,color .1s}
.bpop-type:hover{background:var(--bdr);color:var(--fg)}
.bpop-type.cur{background:var(--acc);color:#fff}
.bpop-actions{}
.bpop-item{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--fg)}
.bpop-item:hover{background:var(--bdr)}
.bpop-item.danger{color:#e55}
.bpop-icon{width:16px;text-align:center;font-size:12px;color:var(--muted)}

/* slash menu */
#slash-menu{position:fixed;display:none;z-index:700;background:var(--hbg);border:1px solid var(--bdr);border-radius:10px;padding:5px;box-shadow:0 8px 30px rgba(0,0,0,.12);width:240px;max-height:320px;overflow-y:auto}
#slash-menu.on{display:block}
.slash-section{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;padding:6px 10px 2px;letter-spacing:.06em}

/* shortcuts */
.sc-panel{position:fixed;bottom:16px;right:16px;background:var(--hbg);border:1px solid var(--bdr);border-radius:8px;padding:12px 16px;font-size:12px;color:var(--muted);line-height:1.9;display:none;z-index:100;box-shadow:0 4px 20px rgba(0,0,0,.08)}
.sc-panel.on{display:block}
.sc-panel strong{color:var(--fg);display:block;margin-bottom:4px}
.sc-panel kbd{font-family:monospace;background:var(--bdr);border-radius:3px;padding:0 4px;font-size:11px;color:var(--fg)}
#sc-toggle{position:fixed;bottom:16px;right:16px;font-size:12px;color:var(--muted);cursor:pointer;user-select:none;border:1px solid var(--bdr);background:var(--hbg);border-radius:5px;padding:4px 8px;z-index:99}
#sc-toggle:hover{color:var(--fg)}
</style>
</head>
<body>
<div id="toolbar">
  <div id="toolbar-row">
    <span class="logo">Pointliner</span>
    <span class="dirty-dot" id="dirty-dot"></span>
    <span class="file-name" id="file-name">unsaved</span>
    <span class="spacer"></span>
    <div id="search-wrap">
      <input id="search-box" type="text" placeholder="Search…" autocomplete="off" spellcheck="false">
      <button id="search-clear" title="Clear search">✕</button>
    </div>
    <span class="spacer"></span>
    <button id="btn-done">Show done</button>
    <button id="btn-new">New</button>
    <button id="btn-open">Open</button>
    <button id="btn-save">Save</button>
    <button id="btn-save-as">Save As</button>
  </div>
  <div id="breadcrumb-row"></div>
</div>
<div id="outline"></div>

<!-- selection toolbar (dark) -->
<div id="sel-tb"></div>
<!-- bullet popup -->
<div id="bpop"></div>
<!-- slash menu -->
<div id="slash-menu"></div>

<span id="sc-toggle">?</span>
<div class="sc-panel" id="sc-panel">
  <strong>Keyboard shortcuts</strong>
  <kbd>Enter</kbd> new sibling · <kbd>Ctrl+Enter</kbd> zoom in<br>
  <kbd>Tab / Shift+Tab</kbd> indent / outdent<br>
  <kbd>Alt+↑/↓</kbd> move · <kbd>Ctrl+↑/↓</kbd> collapse<br>
  <kbd>Escape</kbd> zoom out<br>
  <kbd>/</kbd> commands · <kbd>Ctrl+S</kbd> save · <kbd>Ctrl+O</kbd> open<br>
</div>

<script>
'use strict';

// ─── model ───────────────────────────────────────────────────────────────────

let root      = mkRoot();
let focusedId = null;
let showDone  = false;
let searchQuery = '';
let dirty     = false;
let fileHandle = null;
let fileName  = 'unsaved';

function mkRoot() {
  return { id: uid(), text: '', note: '', type: 'ul', italic: false, underline: false, checked: false, children: [], collapsed: false };
}
function uid() { return Math.random().toString(36).slice(2, 10); }
function mkNode(text = '', type = 'ul') {
  return { id: uid(), text, note: '', type, italic: false, underline: false, checked: false, children: [], collapsed: false };
}
// type that a new Enter-sibling should inherit
function inheritedType(type) {
  return ['h1','h2','h3','divider'].includes(type) ? 'ul' : type;
}

function nodeById(id, n = root) {
  if (n.id === id) return n;
  for (const c of n.children) { const f = nodeById(id, c); if (f) return f; }
  return null;
}
function parentOf(id, n = root, p = null) {
  if (n.id === id) return p;
  for (const c of n.children) { const f = parentOf(id, c, n); if (f !== undefined) return f; }
  return undefined;
}
function pathTo(id, n = root, acc = []) {
  const next = [...acc, n];
  if (n.id === id) return next;
  for (const c of n.children) { const f = pathTo(id, c, next); if (f) return f; }
  return null;
}

// ─── markdown ─────────────────────────────────────────────────────────────────

function mdToHtml(raw, isCode) {
  let s = (raw || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  if (isCode) return s; // code blocks: no markdown
  const codes = [];
  s = s.replace(/`([^`\n]+)`/g, (_,c) => { codes.push(`<code>${c}</code>`); return `\x00${codes.length-1}\x00`; });
  s = s.replace(/\[([^\]]*)\]\((https?:\/\/[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/\*\*\*((?!\s)[\s\S]*?(?<!\s))\*\*\*/g,'<strong><em>$1</em></strong>');
  s = s.replace(/\*\*((?!\s)[\s\S]*?(?<!\s))\*\*/g,'<strong>$1</strong>');
  s = s.replace(/\*((?!\s)[^*\n]*?(?<!\s))\*/g,'<em>$1</em>');
  s = s.replace(/~~([\s\S]*?)~~/g,'<del>$1</del>');
  s = s.replace(/\+\+([\s\S]*?)\+\+/g,'<u>$1</u>');
  s = s.replace(/\x00(\d+)\x00/g,(_,i)=>codes[+i]);
  return s;
}

function stripMd(text) {
  return (text||'')
    .replace(/`([^`\n]+)`/g,'$1')
    .replace(/\[([^\]]*)\]\([^)]+\)/g,'$1')
    .replace(/\*\*\*([\s\S]*?)\*\*\*/g,'$1')
    .replace(/\*\*([\s\S]*?)\*\*/g,'$1')
    .replace(/\*([\s\S]*?)\*/g,'$1')
    .replace(/~~([\s\S]*?)~~/g,'$1')
    .replace(/\+\+([\s\S]*?)\+\+/g,'$1');
}

// ─── OPML ─────────────────────────────────────────────────────────────────────

function toOpml(r) {
  function nx(n, d) {
    const pad = '  '.repeat(d);
    const attrs = [
      `text="${ex(n.text)}"`,
      n.type && n.type !== 'ul' ? `_type="${n.type}"` : '',
      n.italic    ? `_italic="true"` : '',
      n.underline ? `_underline="true"` : '',
      n.checked   ? `_checked="true"` : '',
      n.collapsed ? `_collapsed="true"` : '',
      `_id="${n.id}"`,
    ].filter(Boolean).join(' ');
    if (!n.children.length) return `${pad}<outline ${attrs}/>`;
    return `${pad}<outline ${attrs}>\n${n.children.map(c=>nx(c,d+1)).join('\n')}\n${pad}</outline>`;
  }
  return `<?xml version="1.0" encoding="UTF-8"?>
<opml version="2.0">
  <head><title>${ex(r.text||'Pointliner')}</title><dateModified>${new Date().toUTCString()}</dateModified></head>
  <body>
${r.children.map(c=>nx(c,2)).join('\n')}
  </body>
</opml>`;
}
function ex(s){ return(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function fromOpml(xml) {
  const doc = new DOMParser().parseFromString(xml,'application/xml');
  if (doc.querySelector('parsererror')) throw new Error('Invalid OPML');
  function po(el) {
    const raw = el.getAttribute('_type') || 'ul';
    return {
      id: el.getAttribute('_id') || uid(),
      text: el.getAttribute('text') || '',
      note: el.getAttribute('_note') || '',
      type: raw === 'text' ? 'ul' : raw,
      italic: el.getAttribute('_italic') === 'true',
      underline: el.getAttribute('_underline') === 'true',
      checked: el.getAttribute('_checked') === 'true',
      collapsed: el.getAttribute('_collapsed') === 'true',
      children: Array.from(el.children).filter(c=>c.tagName==='outline').map(po),
    };
  }
  const body = doc.querySelector('body');
  const title = doc.querySelector('head > title')?.textContent || '';
  return { id: uid(), text: title, note: '', type: 'ul', italic: false, underline: false, checked: false, collapsed: false,
    children: body ? Array.from(body.children).filter(c=>c.tagName==='outline').map(po) : [] };
}

// ─── commands (unified) ───────────────────────────────────────────────────────

const BLOCK_CMDS = [
  { id:'ul',      icon:'•',    label:'Bullet',     desc:'Bullet point',     section:'Turn into' },
  { id:'ol',      icon:'1.',   label:'Numbered',   desc:'Numbered list',    section:'Turn into' },
  { id:'todo',    icon:'☐',    label:'To-do',      desc:'Checkbox item',    section:'Turn into' },
  { id:'p',       icon:'¶',    label:'Paragraph',  desc:'Plain paragraph',  section:'Turn into' },
  { id:'h1',      icon:'H1',   label:'Heading 1',  desc:'Large heading',    section:'Turn into' },
  { id:'h2',      icon:'H2',   label:'Heading 2',  desc:'Medium heading',   section:'Turn into' },
  { id:'h3',      icon:'H3',   label:'Heading 3',  desc:'Small heading',    section:'Turn into' },
  { id:'quote',   icon:'❝',    label:'Quote',      desc:'Blockquote',       section:'Turn into' },
  { id:'code',    icon:'</>',  label:'Code block', desc:'Code block',       section:'Turn into' },
  { id:'divider', icon:'—',    label:'Divider',    desc:'Horizontal rule',  section:'Turn into' },
  { id:'style-italic',    icon:'I',  label:'Italic style',    desc:'Toggle italic on node',    section:'Style' },
  { id:'style-underline', icon:'U',  label:'Underline style', desc:'Toggle underline on node', section:'Style' },
];

const INLINE_CMDS = [
  { id:'bold',     icon:'B',   label:'Bold',          desc:'**bold**' },
  { id:'italic',   icon:'I',   label:'Italic',        desc:'*italic*' },
  { id:'uline',    icon:'U',   label:'Underline',     desc:'++underline++' },
  { id:'inlcode',  icon:'`',   label:'Inline code',   desc:'`code`' },
  { id:'strike',   icon:'S',   label:'Strikethrough', desc:'~~strike~~' },
  { id:'link',     icon:'⌘',   label:'Link',          desc:'[text](url)' },
];

// build a unified cmd-item element
function mkCmdItem(icon, label, desc, onClick, active = false) {
  const div = document.createElement('div');
  div.className = 'cmd-item' + (active ? ' hi' : '');
  const ic = document.createElement('div');
  ic.className = 'cmd-icon' + (active ? ' accent' : '');
  ic.textContent = icon;
  const info = document.createElement('div');
  info.className = 'cmd-info';
  info.innerHTML = `<span class="cmd-label">${label}</span>${desc ? `<span class="cmd-desc">${desc}</span>` : ''}`;
  div.append(ic, info);
  div.addEventListener('mousedown', e => { e.preventDefault(); onClick(); });
  return div;
}

// ─── zoom / breadcrumb ───────────────────────────────────────────────────────

function zoomInto(id) { focusedId = id; render(); }
function zoomTo(id)   { focusedId = id; render(); }
function zoomOut() {
  if (!focusedId) return;
  const path = pathTo(focusedId);
  focusedId = (!path || path.length <= 2) ? null : (path[path.length-2].id === root.id ? null : path[path.length-2].id);
  render();
}

function renderBreadcrumb() {
  const bar = document.getElementById('breadcrumb-row');
  if (!focusedId) { bar.classList.remove('visible'); bar.innerHTML = ''; return; }
  const path = pathTo(focusedId) || [];
  bar.innerHTML = ''; bar.classList.add('visible');
  const home = mkCrumb('Home', () => zoomTo(null));
  bar.appendChild(home);
  path.slice(1,-1).forEach(a => { bar.appendChild(mkSep()); bar.appendChild(mkCrumb(a.text||'(untitled)', () => zoomTo(a.id))); });
  const cur = path[path.length-1];
  bar.appendChild(mkSep());
  const ce = mkCrumb(cur?.text||'(untitled)', null); ce.classList.add('current'); bar.appendChild(ce);
}
function mkCrumb(t, fn) { const s=document.createElement('span'); s.className='crumb'; s.textContent=t; s.title=t; if(fn) s.addEventListener('click',fn); return s; }
function mkSep() { const s=document.createElement('span'); s.className='crumb-sep'; s.textContent='›'; return s; }

// ─── render ──────────────────────────────────────────────────────────────────

function render() {
  renderBreadcrumb();
  const container = document.getElementById('outline');
  container.innerHTML = '';
  const vp = focusedId ? nodeById(focusedId) : root;
  if (!vp) { focusedId = null; render(); return; }

  if (focusedId) {
    const te = document.createElement('div');
    te.className = 'zoom-title'; te.contentEditable = 'true'; te.textContent = vp.text;
    te.addEventListener('input', () => { vp.text = te.textContent; markDirty(); renderBreadcrumb(); });
    te.addEventListener('keydown', e => {
      if (e.key==='Enter') { e.preventDefault(); if(vp.children.length) focusNode(vp.children[0].id); }
      if (e.key==='Escape') { e.preventDefault(); zoomOut(); }
    });
    container.appendChild(te);
  }

  if (vp.children.length === 0) { addFirstChild(vp, container); return; }

  if (searchQuery) {
    renderSearch(vp, container);
  } else {
    vp.children.forEach(c => { if (isVisible(c)) renderNode(c, container, 0, vp); });
  }
}

function isVisible(node) {
  return showDone || node.type !== 'todo' || !node.checked;
}

function addFirstChild(parent, container) {
  const n = mkNode();
  parent.children.push(n);
  markDirty();
  renderNode(n, container, 0, parent);
  focusNode(n.id);
}

// Returns the ol number for this node within parent
function olNum(node, parent) {
  if (!parent) return 1;
  let n = 0;
  for (const c of parent.children) {
    if (c === node) break;
    if (c.type === 'ol') n++;
  }
  return n + 1;
}

function renderNode(node, container, depth, parent, opts = {}) {
  const div = document.createElement('div');
  const visKids = node.children.filter(isVisible);
  div.className = [
    'node',
    `nt-${node.type}`,
    visKids.length ? 'has-children' : '',
    node.collapsed  ? 'collapsed' : '',
    node.checked    ? 'checked' : '',
    node.italic     ? 'nc-italic' : '',
    node.underline  ? 'nc-underline' : '',
    opts.searchCtx  ? 'search-ctx' : '',
  ].filter(Boolean).join(' ');
  div.dataset.id = node.id;

  const row = document.createElement('div');
  row.className = 'node-row';

  // collapse btn
  const colBtn = document.createElement('span');
  colBtn.className = 'collapse-btn';
  colBtn.textContent = node.collapsed ? '▶' : '▼';
  colBtn.title = node.collapsed ? 'Expand' : 'Collapse';
  colBtn.addEventListener('click', () => toggleCollapse(node.id));

  // bullet area
  const bullet = document.createElement('span');
  bullet.className = 'bullet';

  if (node.type === 'ol') {
    const num = document.createElement('span');
    num.className = 'ol-num';
    num.textContent = olNum(node, parent) + '.';
    bullet.appendChild(num);
  } else {
    const dot = document.createElement('span');
    dot.className = 'bullet-dot';
    bullet.appendChild(dot);
  }

  if (node.type === 'todo') {
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.className = 'node-checkbox'; cb.checked = node.checked;
    cb.addEventListener('change', () => toggleChecked(node.id, cb.checked));
    bullet.appendChild(cb);
  }

  if (!opts.searchCtx) {
    bullet.addEventListener('click', e => { if (!e.target.classList.contains('node-checkbox')) zoomInto(node.id); });
    bullet.addEventListener('mouseenter', () => showBulletPopup(node.id, bullet));
    bullet.addEventListener('mouseleave', () => scheduleBpopHide());
  }

  // content
  const content = document.createElement('div');
  content.className = 'node-content';
  content.contentEditable = opts.searchCtx ? 'false' : 'true';
  content.spellcheck = true;
  content.dataset.id = node.id;
  content.dataset.ph = depth === 0 && !focusedId ? 'Start writing…' : '';
  content.innerHTML = mdToHtml(node.text, node.type === 'code');

  if (!opts.searchCtx) attachContentEvents(content, node);

  if (opts.highlight) highlightContent(content, searchQuery);

  row.append(colBtn, bullet, content);
  div.appendChild(row);

  // children
  const expanded = opts.searchCtx ? true : !node.collapsed;
  if (visKids.length && expanded) {
    const cd = document.createElement('div');
    cd.className = 'children';
    visKids.forEach(c => renderNode(c, cd, depth+1, node));
    div.appendChild(cd);
  }

  container.appendChild(div);
  return div;
}

// ─── search ───────────────────────────────────────────────────────────────────

function nodeMatchesSearch(node) {
  if (!searchQuery) return false;
  return stripMd(node.text).toLowerCase().includes(searchQuery.toLowerCase());
}

function hasMatchBelow(node) {
  return node.children.some(c => nodeMatchesSearch(c) || hasMatchBelow(c));
}

function renderSearch(vp, container) {
  vp.children.forEach(c => renderSearchNode(c, container, 0, vp));
}

function renderSearchNode(node, container, depth, parent) {
  const self  = nodeMatchesSearch(node);
  const below = hasMatchBelow(node);
  if (!self && !below) return;

  const div = renderNode(node, container, depth, parent, {
    searchCtx: !self,
    highlight: self,
  });

  // In search mode we always show children, and we rebuild the children div
  if (below) {
    let cd = div.querySelector(':scope > .children');
    if (!cd) { cd = document.createElement('div'); cd.className = 'children'; div.appendChild(cd); }
    else cd.innerHTML = '';
    node.children.forEach(c => renderSearchNode(c, cd, depth+1, node));
  }
}

function highlightContent(el, query) {
  if (!query) return;
  const q = query.toLowerCase();
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  const nodes = [];
  let n;
  while ((n = walker.nextNode())) nodes.push(n);
  for (const tn of nodes) {
    const text = tn.textContent;
    const idx = text.toLowerCase().indexOf(q);
    if (idx === -1) continue;
    const mark = document.createElement('mark');
    mark.textContent = text.slice(idx, idx + query.length);
    const frag = document.createDocumentFragment();
    frag.appendChild(document.createTextNode(text.slice(0, idx)));
    frag.appendChild(mark);
    frag.appendChild(document.createTextNode(text.slice(idx + query.length)));
    tn.parentNode.replaceChild(frag, tn);
  }
}

// ─── content events ───────────────────────────────────────────────────────────

let activeContentId = null;

function attachContentEvents(content, node) {
  content.addEventListener('mousedown', e => {
    if (content.dataset.editing) return;
    e.preventDefault();
    enterEdit(content, node);
    content.focus();
    const r = caretFromPoint(e.clientX, e.clientY, content);
    if (r) { const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }
  });
  content.addEventListener('focus', () => { if (!content.dataset.editing) enterEdit(content, node); });
  content.addEventListener('blur', () => { if (content.dataset.editing) exitEdit(content, node); });
  content.addEventListener('input', () => {
    if (!content.dataset.editing) return;
    node.text = content.textContent; markDirty();
    checkSlash(content, node.id); updateSelToolbar();
  });
  content.addEventListener('keydown', e => onKeyDown(e, node.id, content));
  content.addEventListener('paste', e => handlePaste(e, node, content));
  content.addEventListener('mouseup', updateSelToolbar);
  content.addEventListener('keyup', updateSelToolbar);
}

function enterEdit(content, node) {
  content.dataset.editing = '1';
  content.textContent = node.text;
  activeContentId = node.id;
}

function exitEdit(content, node) {
  node.text = content.textContent;
  delete content.dataset.editing;
  content.innerHTML = mdToHtml(node.text, node.type === 'code');
  markDirty();
  if (activeContentId === node.id) activeContentId = null;
  hideSlashMenu(); updateSelToolbar();
}

function caretFromPoint(x, y) {
  try {
    if (document.caretRangeFromPoint) return document.caretRangeFromPoint(x, y);
    if (document.caretPositionFromPoint) {
      const p = document.caretPositionFromPoint(x, y);
      if (!p) return null;
      const r = document.createRange(); r.setStart(p.offsetNode, p.offset); r.collapse(true); return r;
    }
  } catch(_) {}
  return null;
}

// ─── paste ───────────────────────────────────────────────────────────────────

function handlePaste(e, node, content) {
  e.preventDefault();
  const text = e.clipboardData.getData('text/plain');
  const lines = text.split('\n').map(l => l.replace(/\r$/,''));
  while (lines.length > 1 && !lines[lines.length-1].trim()) lines.pop();
  if (lines.length === 1) { document.execCommand('insertText', false, text); node.text = content.textContent; markDirty(); return; }
  const parsed = parseMLlines(lines);
  const parent = parentOf(node.id);
  if (!parent) { document.execCommand('insertText', false, text); return; }
  node.text += parsed[0].text; content.textContent = node.text;
  const idx = parent.children.findIndex(c => c.id === node.id);
  const newNodes = [];
  function ins(items, tp, ai) {
    items.forEach((it, i) => {
      const nn = mkNode(it.text); tp.children.splice(ai+1+i, 0, nn); newNodes.push(nn);
      it.children.forEach(ch => { const cn = mkNode(ch.text); nn.children.push(cn); newNodes.push(cn); });
    });
  }
  ins(parsed.slice(1), parent, idx);
  markDirty(); render();
  if (newNodes.length) focusNode(newNodes[newNodes.length-1].id);
}

function parseMLlines(lines) {
  const result = [];
  const stack = [{ indent:-1, item:{ text:'', children:result } }];
  for (const line of lines) {
    const m = line.match(/^(\s*)([-*+]|\d+\.)\s+(.*)/);
    if (m) {
      const indent = m[1].length, text = m[3], item = { text, children:[] };
      while (stack.length > 1 && stack[stack.length-1].indent >= indent) stack.pop();
      stack[stack.length-1].item.children.push(item);
      stack.push({ indent, item });
    } else {
      const item = { text: line.trim(), children:[] };
      result.push(item); stack.length = 1; stack[0].item = { text:'', children:result };
    }
  }
  return result;
}

// ─── keydown ─────────────────────────────────────────────────────────────────

function onKeyDown(e, id, content) {
  const ctrl = e.ctrlKey || e.metaKey;
  if (slashState && isSlashMenuOpen()) {
    if (e.key==='ArrowDown') { e.preventDefault(); slashMove(1); return; }
    if (e.key==='ArrowUp')   { e.preventDefault(); slashMove(-1); return; }
    if (e.key==='Enter'||e.key==='Tab') { e.preventDefault(); slashApply(); return; }
    if (e.key==='Escape')    { e.preventDefault(); hideSlashMenu(); return; }
  }
  if (e.key==='Enter' && !e.shiftKey && !ctrl) { e.preventDefault(); insertSiblingAfter(id); }
  else if (e.key==='Enter' && ctrl) { e.preventDefault(); zoomInto(id); }
  else if (e.key==='Tab' && !e.shiftKey) { e.preventDefault(); indentNode(id); }
  else if (e.key==='Tab' && e.shiftKey)  { e.preventDefault(); outdentNode(id); }
  else if (e.key==='Backspace') {
    const node = nodeById(id);
    if (node && content.textContent==='' && node.children.length===0) { e.preventDefault(); deleteNode(id); }
  }
  else if (e.key==='ArrowUp'   && e.altKey)  { e.preventDefault(); moveNode(id,-1); }
  else if (e.key==='ArrowDown' && e.altKey)  { e.preventDefault(); moveNode(id, 1); }
  else if (e.key==='ArrowUp'   && ctrl) { e.preventDefault(); setCollapsed(id,true); }
  else if (e.key==='ArrowDown' && ctrl) { e.preventDefault(); setCollapsed(id,false); }
  else if (e.key==='Escape') { e.preventDefault(); zoomOut(); }
  else if (e.key==='s' && ctrl) { e.preventDefault(); saveFile(); }
  else if (e.key==='o' && ctrl) { e.preventDefault(); openFile(); }
}

// ─── selection toolbar ───────────────────────────────────────────────────────

const selTb = document.getElementById('sel-tb');
selTb.addEventListener('mousedown', e => e.preventDefault());

function buildSelTb() {
  selTb.innerHTML = '';
  INLINE_CMDS.forEach((cmd, i) => {
    if (i === 4) { const sep = document.createElement('div'); sep.className = 'cmd-sep'; selTb.appendChild(sep); }
    const item = mkCmdItem(cmd.icon, cmd.label, '', () => applyInlineFormat(cmd.id));
    selTb.appendChild(item);
  });
}
buildSelTb();

function updateSelToolbar() {
  requestAnimationFrame(() => {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.rangeCount) { hideSelTb(); return; }
    const range = sel.getRangeAt(0);
    const anchor = range.commonAncestorContainer;
    const cnt = anchor.nodeType===1 ? anchor.closest?.('.node-content') : anchor.parentElement?.closest('.node-content');
    if (!cnt || !cnt.dataset.editing) { hideSelTb(); return; }
    const rect = range.getBoundingClientRect();
    if (!rect.width) { hideSelTb(); return; }
    selTb.classList.add('on');
    selTb.style.left = (rect.left + rect.width/2) + 'px';
    selTb.style.top  = (rect.top - 46 + window.scrollY) + 'px';
  });
}
function hideSelTb() { selTb.classList.remove('on'); }
document.addEventListener('selectionchange', updateSelToolbar);
document.addEventListener('mousedown', e => { if (!e.target.closest('#sel-tb')) hideSelTb(); });

function applyInlineFormat(fmt) {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) return;
  const range = sel.getRangeAt(0);
  const selected = range.toString();
  if (!selected) return;
  const map = { bold:`**${selected}**`, italic:`*${selected}*`, uline:`++${selected}++`, inlcode:`\`${selected}\``, strike:`~~${selected}~~` };
  let wrapped = map[fmt];
  if (fmt === 'link') {
    const url = prompt('URL (https://…):');
    if (!url) return;
    wrapped = `[${selected}](${url})`;
  }
  if (!wrapped) return;
  document.execCommand('insertText', false, wrapped);
  const cnt = range.commonAncestorContainer?.parentElement?.closest('.node-content')
    || range.commonAncestorContainer?.closest?.('.node-content');
  if (cnt) { const nd = nodeById(cnt.dataset.id); if (nd) { nd.text = cnt.textContent; markDirty(); } }
  hideSelTb();
}

// ─── bullet popup ─────────────────────────────────────────────────────────────

const bpop = document.getElementById('bpop');
let bpopTimer = null;
bpop.addEventListener('mouseenter', () => clearTimeout(bpopTimer));
bpop.addEventListener('mouseleave', scheduleBpopHide);
bpop.addEventListener('mousedown', e => e.preventDefault());

function showBulletPopup(nodeId, bulletEl) {
  clearTimeout(bpopTimer);
  const node = nodeById(nodeId);
  if (!node) return;
  bpop.innerHTML = '';

  // type switcher row
  const typeRow = document.createElement('div');
  typeRow.className = 'bpop-types';
  BLOCK_CMDS.filter(c => c.section === 'Turn into').forEach(cmd => {
    const btn = document.createElement('div');
    btn.className = 'bpop-type' + (node.type === cmd.id ? ' cur' : '');
    btn.textContent = cmd.icon;
    btn.title = cmd.label;
    btn.addEventListener('mousedown', e => { e.preventDefault(); applyBlockCmd(cmd.id, nodeId); hideBpop(); });
    typeRow.appendChild(btn);
  });
  bpop.appendChild(typeRow);

  // style toggles row
  const styleRow = document.createElement('div');
  styleRow.className = 'bpop-types';
  [{ id:'style-italic', icon:'I', label:'Italic style', flag:'italic' }, { id:'style-underline', icon:'U', label:'Underline style', flag:'underline' }].forEach(s => {
    const btn = document.createElement('div');
    btn.className = 'bpop-type' + (node[s.flag] ? ' cur' : '');
    btn.style.fontStyle = s.flag==='italic' ? 'italic' : 'normal';
    btn.style.textDecoration = s.flag==='underline' ? 'underline' : 'none';
    btn.textContent = s.icon;
    btn.title = s.label;
    btn.addEventListener('mousedown', e => { e.preventDefault(); applyBlockCmd(s.id, nodeId); hideBpop(); });
    styleRow.appendChild(btn);
  });
  bpop.appendChild(styleRow);

  // actions
  const actions = [
    { icon:'⊙', label:'Zoom into',  fn: () => { zoomInto(nodeId); hideBpop(); } },
    { icon:'↑',  label:'Move up',   fn: () => { moveNode(nodeId,-1); hideBpop(); } },
    { icon:'↓',  label:'Move down', fn: () => { moveNode(nodeId, 1); hideBpop(); } },
    { icon:'✕',  label:'Delete',    fn: () => { deleteNode(nodeId); hideBpop(); }, danger:true },
  ];
  actions.forEach(({ icon, label, fn, danger }) => {
    const d = document.createElement('div');
    d.className = 'bpop-item' + (danger ? ' danger' : '');
    d.innerHTML = `<span class="bpop-icon">${icon}</span><span>${label}</span>`;
    d.addEventListener('mousedown', e => { e.preventDefault(); fn(); });
    bpop.appendChild(d);
  });

  const rect = bulletEl.getBoundingClientRect();
  bpop.style.left = (rect.right + 4) + 'px';
  bpop.style.top  = rect.top + 'px';
  bpop.classList.add('on');
  requestAnimationFrame(() => {
    const pr = bpop.getBoundingClientRect();
    if (pr.right  > window.innerWidth  - 8) bpop.style.left = (rect.left - pr.width - 4) + 'px';
    if (pr.bottom > window.innerHeight - 8) bpop.style.top  = (window.innerHeight - pr.height - 8) + 'px';
  });
}
function scheduleBpopHide() { bpopTimer = setTimeout(hideBpop, 300); }
function hideBpop() { bpop.classList.remove('on'); }
document.addEventListener('click', e => { if (!e.target.closest('#bpop') && !e.target.closest('.bullet')) hideBpop(); });

// ─── slash commands ───────────────────────────────────────────────────────────

const slashMenu = document.getElementById('slash-menu');
let slashState = null;
function isSlashMenuOpen() { return slashMenu.classList.contains('on'); }
slashMenu.addEventListener('mousedown', e => e.preventDefault());

const ALL_SLASH = [
  ...BLOCK_CMDS,
  ...INLINE_CMDS.map(c => ({ ...c, section: 'Format' })),
];

function checkSlash(content, nodeId) {
  const pos = getCaretOffset(content);
  const before = content.textContent.slice(0, pos);
  const m = before.match(/(^|[\s])\/(\w*)$/);
  if (!m) { hideSlashMenu(); return; }
  const query = m[2].toLowerCase();
  const slashOffset = pos - query.length - 1;
  const matches = ALL_SLASH.filter(c =>
    c.id.startsWith(query) || c.label.toLowerCase().includes(query)
  );
  if (!matches.length) { hideSlashMenu(); return; }
  slashState = { nodeId, content, slashOffset, query, activeIdx:0, matches };
  renderSlashMenu();
  positionSlashMenu(content, slashOffset);
}

function renderSlashMenu() {
  if (!slashState) return;
  slashMenu.innerHTML = '';
  let lastSection = null;
  slashState.matches.forEach((cmd, i) => {
    const section = cmd.section || 'Format';
    if (section !== lastSection) {
      const hdr = document.createElement('div');
      hdr.className = 'slash-section'; hdr.textContent = section;
      slashMenu.appendChild(hdr); lastSection = section;
    }
    const item = mkCmdItem(cmd.icon, cmd.label, cmd.desc, () => { slashState.activeIdx = i; slashApply(); }, i === slashState.activeIdx);
    slashMenu.appendChild(item);
  });
  slashMenu.classList.add('on');
}

function positionSlashMenu(content, slashOffset) {
  const tn = content.firstChild;
  if (!tn || tn.nodeType !== 3) { slashMenu.style.left='0'; slashMenu.style.top='0'; return; }
  const range = document.createRange();
  range.setStart(tn, Math.min(slashOffset, tn.length));
  range.setEnd(tn, Math.min(slashOffset+1, tn.length));
  const rect = range.getBoundingClientRect();
  slashMenu.style.left = rect.left + 'px';
  slashMenu.style.top  = (rect.bottom + 4) + 'px';
  requestAnimationFrame(() => {
    const mr = slashMenu.getBoundingClientRect();
    if (mr.right  > window.innerWidth - 8) slashMenu.style.left = (window.innerWidth - mr.width - 8) + 'px';
    if (mr.bottom > window.innerHeight - 8) slashMenu.style.top = (rect.top - mr.height - 4) + 'px';
  });
}

function slashMove(dir) {
  if (!slashState) return;
  const n = slashState.matches.length;
  slashState.activeIdx = (slashState.activeIdx + dir + n) % n;
  renderSlashMenu();
}

function slashApply() {
  if (!slashState) return;
  const { nodeId, content, slashOffset, activeIdx, matches } = slashState;
  const cmd = matches[activeIdx];
  hideSlashMenu();
  const afterSlash = content.textContent.slice(slashOffset+1).match(/^\w*/)?.[0] ?? '';
  const rawLen = 1 + afterSlash.length;
  const newText = content.textContent.slice(0, slashOffset) + content.textContent.slice(slashOffset + rawLen);
  content.textContent = newText;
  const node = nodeById(nodeId);
  if (node) node.text = newText;
  try {
    const tn = content.firstChild || content;
    const r = document.createRange();
    r.setStart(tn, Math.min(slashOffset, newText.length)); r.collapse(true);
    window.getSelection().removeAllRanges(); window.getSelection().addRange(r);
  } catch(_) {}
  applyBlockCmd(cmd.id, nodeId, node, content);
  markDirty();
}

function hideSlashMenu() { slashMenu.classList.remove('on'); slashState = null; }

function applyBlockCmd(id, nodeId, node, content) {
  node = node || nodeById(nodeId);
  if (!node) return;
  // inline formatting
  if (['bold','italic','uline','inlcode','strike'].includes(id)) {
    const map = { bold:'**', italic:'*', uline:'++', inlcode:'`', strike:'~~' };
    const m = map[id];
    node.text = `${m}${node.text}${m}`;
    if (content) content.textContent = node.text;
    else { const c = document.querySelector(`.node-content[data-id="${nodeId}"]`); if(c) c.textContent=node.text; }
    return;
  }
  if (id === 'link') {
    const url = prompt('URL (https://…):');
    if (!url) return;
    node.text = `[${node.text}](${url})`;
    const c = document.querySelector(`.node-content[data-id="${nodeId}"]`); if(c) c.textContent=node.text;
    return;
  }
  // style toggles
  if (id === 'style-italic')    { node.italic    = !node.italic;    markDirty(); rerenderNode(nodeId); return; }
  if (id === 'style-underline') { node.underline = !node.underline; markDirty(); rerenderNode(nodeId); return; }
  // block type
  node.type = id;
  if (id !== 'todo') node.checked = false;
  markDirty();
  rerenderNode(nodeId);
}

function getCaretOffset(el) {
  const sel = window.getSelection();
  if (!sel?.rangeCount) return 0;
  const r = sel.getRangeAt(0), pre = r.cloneRange();
  pre.selectNodeContents(el); pre.setEnd(r.startContainer, r.startOffset);
  return pre.toString().length;
}

// ─── node type / checked ─────────────────────────────────────────────────────

function setNodeType(id, type) {
  const node = nodeById(id);
  if (!node) return;
  node.type = type;
  if (type !== 'todo') node.checked = false;
  markDirty(); rerenderNode(id);
}

function toggleChecked(id, checked) {
  const node = nodeById(id);
  if (!node) return;
  node.checked = checked; markDirty();
  if (!showDone && checked) {
    const el = document.querySelector(`.node[data-id="${id}"]`);
    if (el) el.remove();
    updatePHC(parentOf(id));
  } else {
    const el = document.querySelector(`.node[data-id="${id}"]`);
    if (el) el.classList.toggle('checked', checked);
  }
}

function updatePHC(parent) {
  if (!parent || parent === root) return;
  const el = document.querySelector(`.node[data-id="${parent.id}"]`);
  if (el) el.classList.toggle('has-children', parent.children.some(isVisible));
}

function rerenderNode(id) {
  const el = document.querySelector(`.node[data-id="${id}"]`);
  const parent = parentOf(id);
  if (!el || !parent) { render(); return; }
  const node = nodeById(id);
  if (!node) { el.remove(); return; }
  const container = el.parentElement, next = el.nextSibling;
  el.remove();
  const wrap = document.createElement('div');
  renderNode(node, wrap, 0, parent);
  const rendered = wrap.firstChild;
  if (next) container.insertBefore(rendered, next);
  else container.appendChild(rendered);
  focusNode(id);
}

// ─── tree mutations ───────────────────────────────────────────────────────────

function insertSiblingAfter(id) {
  const parent = parentOf(id);
  if (!parent) return;
  const idx = parent.children.findIndex(c => c.id === id);
  const srcNode = nodeById(id);
  const nn = mkNode('', srcNode ? inheritedType(srcNode.type) : 'ul');
  parent.children.splice(idx+1, 0, nn);
  markDirty();
  const curEl = document.querySelector(`.node[data-id="${id}"]`);
  if (curEl) {
    const wrap = document.createElement('div');
    renderNode(nn, wrap, 0, parent);
    curEl.parentElement.insertBefore(wrap.firstChild, curEl.nextSibling);
    focusNode(nn.id);
  } else { render(); focusNode(nn.id); }
}

function indentNode(id) {
  const parent = parentOf(id);
  if (!parent) return;
  const idx = parent.children.findIndex(c => c.id === id);
  if (idx === 0) return;
  const np = parent.children[idx-1];
  const [node] = parent.children.splice(idx,1);
  np.children.push(node);
  if (np.collapsed) np.collapsed = false;
  markDirty(); render(); focusNode(id);
}

function outdentNode(id) {
  const parent = parentOf(id);
  if (!parent || parent === root) return;
  if (focusedId && parent.id === focusedId) return;
  const gp = parentOf(parent.id);
  if (!gp) return;
  const idx = parent.children.findIndex(c => c.id === id);
  const [node] = parent.children.splice(idx,1);
  const pi = gp.children.findIndex(c => c.id === parent.id);
  gp.children.splice(pi+1, 0, node);
  markDirty(); render(); focusNode(id);
}

function deleteNode(id) {
  const parent = parentOf(id);
  if (!parent) return;
  const idx = parent.children.findIndex(c => c.id === id);
  parent.children.splice(idx,1); markDirty();
  let ft = null;
  if (idx > 0) ft = lastVis(parent.children[idx-1]).id;
  else if (parent.id !== root.id && parent.id !== focusedId) ft = parent.id;
  const el = document.querySelector(`.node[data-id="${id}"]`);
  if (el) el.remove(); updatePHC(parent);
  const vp = focusedId ? nodeById(focusedId) : root;
  if (vp && vp.children.length === 0) addFirstChild(vp, document.getElementById('outline'));
  else if (ft) focusNode(ft);
}

function lastVis(node) {
  if (node.collapsed || !node.children.some(isVisible)) return node;
  const v = node.children.filter(isVisible);
  return lastVis(v[v.length-1]);
}

function moveNode(id, dir) {
  const parent = parentOf(id);
  if (!parent) return;
  const idx = parent.children.findIndex(c => c.id === id);
  const ni = idx + dir;
  if (ni < 0 || ni >= parent.children.length) return;
  [parent.children[idx], parent.children[ni]] = [parent.children[ni], parent.children[idx]];
  markDirty();
  const el = document.querySelector(`.node[data-id="${id}"]`);
  if (el) {
    if (dir===-1) { const p=el.previousElementSibling; if(p) el.parentElement.insertBefore(el,p); }
    else { const n=el.nextElementSibling; if(n) el.parentElement.insertBefore(n,el); }
    focusNode(id);
  } else { render(); focusNode(id); }
}

function setCollapsed(id, val) {
  const node = nodeById(id);
  if (!node) return;
  node.collapsed = val; markDirty();
  const el = document.querySelector(`.node[data-id="${id}"]`);
  if (!el) return;
  el.classList.toggle('collapsed', val);
  const btn = el.querySelector(':scope>.node-row>.collapse-btn');
  if (btn) { btn.textContent = val ? '▶' : '▼'; btn.title = val ? 'Expand' : 'Collapse'; }
}
function toggleCollapse(id) { const n=nodeById(id); if(n) setCollapsed(id,!n.collapsed); }

function focusNode(id) {
  requestAnimationFrame(() => {
    const el = document.querySelector(`.node-content[data-id="${id}"]`);
    if (!el) return;
    const node = nodeById(id);
    if (!el.dataset.editing && node) enterEdit(el, node);
    el.focus();
    const r = document.createRange();
    r.selectNodeContents(el); r.collapse(false);
    const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  });
}

// ─── dirty ────────────────────────────────────────────────────────────────────

function markDirty() { dirty=true; document.getElementById('toolbar-row').classList.add('dirty'); }
function markClean() { dirty=false; document.getElementById('toolbar-row').classList.remove('dirty'); }

// ─── file I/O ─────────────────────────────────────────────────────────────────

const hasFSA = 'showOpenFilePicker' in window;
const OPML_TYPE = { description:'OPML outline', accept:{'text/x-opml':['.opml']} };

async function newFile() {
  if (dirty && !confirm('Discard unsaved changes?')) return;
  root = mkRoot(); focusedId = null; fileHandle = null; fileName = 'unsaved'; searchQuery = '';
  document.getElementById('file-name').textContent = fileName;
  document.getElementById('search-box').value = '';
  document.getElementById('search-clear').classList.remove('on');
  markClean(); render();
}

async function openFile() {
  if (dirty && !confirm('Discard unsaved changes?')) return;
  if (hasFSA) {
    try {
      [fileHandle] = await window.showOpenFilePicker({ types:[OPML_TYPE] });
      const file = await fileHandle.getFile();
      fileName = file.name;
      root = fromOpml(await file.text());
      focusedId = null; searchQuery = '';
      document.getElementById('file-name').textContent = fileName;
      document.getElementById('search-box').value = '';
      document.getElementById('search-clear').classList.remove('on');
      markClean(); render();
    } catch(e) { if (e.name!=='AbortError') alert('Could not open: '+e.message); }
  } else {
    const inp = document.createElement('input');
    inp.type='file'; inp.accept='.opml,text/x-opml,application/xml,text/xml';
    inp.onchange = async () => {
      const file = inp.files[0]; if (!file) return;
      fileName = file.name;
      try { root = fromOpml(await file.text()); focusedId=null; searchQuery=''; document.getElementById('file-name').textContent=fileName; markClean(); render(); }
      catch(e) { alert('Invalid file: '+e.message); }
    };
    inp.click();
  }
}

async function saveFile() {
  if (hasFSA) { if (fileHandle) await writeH(fileHandle); else await saveAsFile(); }
  else dlOpml();
}
async function saveAsFile() {
  if (hasFSA) {
    try {
      fileHandle = await window.showSaveFilePicker({
        suggestedName: (fileName==='unsaved' ? 'outline' : fileName.replace(/\.opml$/i,'')) + '.opml',
        types:[OPML_TYPE],
      });
      fileName = fileHandle.name;
      document.getElementById('file-name').textContent = fileName;
      await writeH(fileHandle);
    } catch(e) { if (e.name!=='AbortError') alert('Could not save: '+e.message); }
  } else dlOpml();
}
function dlOpml() {
  const blob = new Blob([toOpml(root)],{type:'text/x-opml'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=(fileName==='unsaved'?'outline':fileName.replace(/\.opml$/i,''))+'.opml';
  a.click(); URL.revokeObjectURL(url); markClean();
}
async function writeH(h) {
  try { const w=await h.createWritable(); await w.write(toOpml(root)); await w.close(); markClean(); }
  catch(e) { alert('Save failed: '+e.message); }
}

// ─── search wiring ────────────────────────────────────────────────────────────

document.getElementById('search-box').addEventListener('input', function() {
  searchQuery = this.value.trim();
  document.getElementById('search-clear').classList.toggle('on', !!searchQuery);
  render();
});
document.getElementById('search-clear').addEventListener('click', () => {
  searchQuery = '';
  document.getElementById('search-box').value = '';
  document.getElementById('search-clear').classList.remove('on');
  render();
});
document.getElementById('search-box').addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    searchQuery = ''; document.getElementById('search-box').value = '';
    document.getElementById('search-clear').classList.remove('on');
    render(); document.getElementById('search-box').blur();
  }
});

// ─── boot ─────────────────────────────────────────────────────────────────────

document.getElementById('btn-new').addEventListener('click', newFile);
document.getElementById('btn-open').addEventListener('click', openFile);
document.getElementById('btn-save').addEventListener('click', saveFile);
document.getElementById('btn-save-as').addEventListener('click', saveAsFile);
document.getElementById('btn-done').addEventListener('click', () => {
  showDone = !showDone;
  document.getElementById('btn-done').textContent = showDone ? 'Hide done' : 'Show done';
  document.getElementById('btn-done').classList.toggle('active', showDone);
  render();
});
document.getElementById('sc-toggle').addEventListener('click', () => document.getElementById('sc-panel').classList.toggle('on'));
document.getElementById('sc-panel').addEventListener('click', () => document.getElementById('sc-panel').classList.remove('on'));
document.addEventListener('keydown', e => {
  const ctrl = e.ctrlKey || e.metaKey;
  if (ctrl && e.key==='s') { e.preventDefault(); saveFile(); }
  if (ctrl && e.key==='o') { e.preventDefault(); openFile(); }
});
window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue=''; } });

render();
</script>
</body>
