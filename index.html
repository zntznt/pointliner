<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pointliner</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #fafaf8;
    --fg: #1a1a1a;
    --muted: #999;
    --bullet: #bbb;
    --bullet-hover: #4a90d9;
    --collapse-btn: #bbb;
    --indent: 24px;
    --line-height: 1.65;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --header-bg: #fff;
    --border: #e8e8e8;
    --accent: #4a90d9;
    --focus-ring: rgba(74, 144, 217, 0.25);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e;
      --fg: #e5e5e5;
      --muted: #666;
      --bullet: #555;
      --bullet-hover: #5ba3e8;
      --collapse-btn: #555;
      --header-bg: #111;
      --border: #2a2a2a;
      --accent: #5ba3e8;
    }
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    font-size: 15px;
    line-height: var(--line-height);
    min-height: 100vh;
  }

  /* ── Header ─────────────────────────────────────────────── */

  #toolbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--header-bg);
    border-bottom: 1px solid var(--border);
  }

  #toolbar-row {
    padding: 0 20px;
    height: 44px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo {
    font-weight: 700;
    font-size: 16px;
    letter-spacing: -0.3px;
    color: var(--fg);
    flex-shrink: 0;
  }

  #breadcrumb-row {
    display: none;
    padding: 5px 20px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px;
    background: var(--header-bg);
  }
  #breadcrumb-row.visible { display: flex; }

  .crumb {
    color: var(--muted);
    cursor: pointer;
    border-radius: 3px;
    padding: 1px 4px;
    white-space: nowrap;
    max-width: 180px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .crumb:hover { color: var(--accent); }
  .crumb.current { color: var(--fg); font-weight: 500; cursor: default; }
  .crumb-sep { color: var(--muted); user-select: none; font-size: 11px; }

  .spacer { flex: 1; }

  .file-name {
    font-size: 13px;
    color: var(--muted);
    max-width: 160px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .dirty-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    display: none;
    flex-shrink: 0;
  }
  .dirty .dirty-dot { display: block; }

  button {
    cursor: pointer;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--fg);
    font-family: inherit;
    font-size: 13px;
    padding: 4px 10px;
    border-radius: 5px;
    transition: background 0.1s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  button:hover { background: var(--border); }

  /* ── Outline ─────────────────────────────────────────────── */

  #outline {
    max-width: 760px;
    margin: 0 auto;
    padding: 28px 24px 120px;
  }

  .zoom-title {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.4px;
    margin-bottom: 18px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
    color: var(--fg);
    outline: none;
    word-break: break-word;
    white-space: pre-wrap;
    cursor: text;
  }
  .zoom-title:empty::before {
    content: '(untitled)';
    color: var(--muted);
    font-style: italic;
    font-weight: 400;
    pointer-events: none;
  }
  .zoom-title:focus { box-shadow: 0 0 0 2px var(--focus-ring); border-radius: 3px; }

  .node { position: relative; }

  .node-row {
    display: flex;
    align-items: flex-start;
    padding: 1px 0;
  }

  .collapse-btn {
    width: 18px;
    height: 26px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--collapse-btn);
    font-size: 9px;
    user-select: none;
    visibility: hidden;
    transition: color 0.1s;
  }
  .has-children > .node-row > .collapse-btn { visibility: visible; }
  .collapse-btn:hover { color: var(--accent); }

  .bullet {
    width: 20px;
    height: 26px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .bullet::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--bullet);
    transition: background 0.12s, transform 0.12s;
    display: block;
  }
  .bullet:hover::before {
    background: var(--bullet-hover);
    transform: scale(1.3);
  }

  .node-content {
    flex: 1;
    min-width: 0;
    outline: none;
    word-break: break-word;
    white-space: pre-wrap;
    line-height: var(--line-height);
    padding: 1px 3px;
    border-radius: 3px;
  }
  .node-content:focus { box-shadow: 0 0 0 2px var(--focus-ring); }
  .node-content:empty::before {
    content: attr(data-placeholder);
    color: var(--muted);
    pointer-events: none;
  }

  .children { padding-left: var(--indent); }
  .collapsed > .children { display: none; }

  /* ── Shortcuts ───────────────────────────────────────────── */

  .shortcuts-panel {
    position: fixed;
    bottom: 16px;
    right: 16px;
    background: var(--header-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.9;
    display: none;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(0,0,0,.08);
  }
  .shortcuts-panel.visible { display: block; }
  .shortcuts-panel strong { color: var(--fg); display: block; margin-bottom: 4px; }
  .shortcuts-panel kbd {
    font-family: monospace;
    background: var(--border);
    border-radius: 3px;
    padding: 0 4px;
    font-size: 11px;
    color: var(--fg);
  }
  #shortcuts-toggle {
    position: fixed;
    bottom: 16px;
    right: 16px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
    border: 1px solid var(--border);
    background: var(--header-bg);
    border-radius: 5px;
    padding: 4px 8px;
    z-index: 99;
  }
  #shortcuts-toggle:hover { color: var(--fg); }
</style>
</head>
<body>

<div id="toolbar">
  <div id="toolbar-row">
    <span class="logo">Pointliner</span>
    <span class="dirty-dot" id="dirty-dot"></span>
    <span class="file-name" id="file-name">unsaved</span>
    <span class="spacer"></span>
    <button id="btn-new">New</button>
    <button id="btn-open">Open</button>
    <button id="btn-save">Save</button>
    <button id="btn-save-as">Save As</button>
  </div>
  <div id="breadcrumb-row"></div>
</div>

<div id="outline"></div>

<span id="shortcuts-toggle">?</span>
<div class="shortcuts-panel" id="shortcuts-panel">
  <strong>Keyboard shortcuts</strong>
  <kbd>Enter</kbd> new sibling below<br>
  <kbd>Tab</kbd> indent (make child)<br>
  <kbd>Shift+Tab</kbd> outdent<br>
  <kbd>Alt+↑/↓</kbd> move node up/down<br>
  <kbd>Ctrl+↑/↓</kbd> collapse/expand<br>
  <kbd>Backspace</kbd> delete if empty<br>
  <kbd>Ctrl+Enter</kbd> zoom into node<br>
  <kbd>Escape</kbd> zoom out<br>
  <kbd>Ctrl+S</kbd> save · <kbd>Ctrl+O</kbd> open<br>
</div>

<script>
// ─── Data model ──────────────────────────────────────────────────────────────

let root = { id: uid(), text: '', note: '', children: [], collapsed: false };
let focusedId = null; // null = root view; string = zoomed into this node
let dirty = false;
let fileHandle = null;
let fileName = 'unsaved';

function uid() {
  return Math.random().toString(36).slice(2, 10);
}

function nodeById(id, node = root) {
  if (node.id === id) return node;
  for (const c of node.children) {
    const found = nodeById(id, c);
    if (found) return found;
  }
  return null;
}

// Returns the parent node, or null if id is a direct child of root,
// or undefined if not found.
function parentOf(id, node = root, parent = null) {
  if (node.id === id) return parent;
  for (const c of node.children) {
    const found = parentOf(id, c, node);
    if (found !== undefined) return found;
  }
  return undefined;
}

// Returns ordered array of nodes from root down to (and including) the node with id.
function pathTo(id, node = root, path = []) {
  const next = [...path, node];
  if (node.id === id) return next;
  for (const c of node.children) {
    const found = pathTo(id, c, next);
    if (found) return found;
  }
  return null;
}

// ─── OPML ────────────────────────────────────────────────────────────────────

function toOpml(rootNode) {
  const title = rootNode.text || 'Pointliner';
  const date = new Date().toUTCString();

  function nodeToXml(node, depth) {
    const pad = '  '.repeat(depth);
    const attrs = [
      `text="${escXml(node.text)}"`,
      node.note       ? `_note="${escXml(node.note)}"` : '',
      node.collapsed  ? `_collapsed="true"` : '',
      `_id="${node.id}"`,
    ].filter(Boolean).join(' ');

    if (!node.children.length) return `${pad}<outline ${attrs}/>`;
    const kids = node.children.map(c => nodeToXml(c, depth + 1)).join('\n');
    return `${pad}<outline ${attrs}>\n${kids}\n${pad}</outline>`;
  }

  const body = rootNode.children.map(c => nodeToXml(c, 2)).join('\n');
  return `<?xml version="1.0" encoding="UTF-8"?>
<opml version="2.0">
  <head>
    <title>${escXml(title)}</title>
    <dateModified>${date}</dateModified>
  </head>
  <body>
${body}
  </body>
</opml>`;
}

function escXml(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function fromOpml(xmlText) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(xmlText, 'application/xml');
  const err = doc.querySelector('parsererror');
  if (err) throw new Error('Invalid OPML: ' + err.textContent.slice(0, 100));

  const title = doc.querySelector('head > title')?.textContent || '';

  function parseOutline(el) {
    return {
      id:        el.getAttribute('_id') || uid(),
      text:      el.getAttribute('text') || '',
      note:      el.getAttribute('_note') || '',
      collapsed: el.getAttribute('_collapsed') === 'true',
      children:  Array.from(el.children)
                   .filter(c => c.tagName === 'outline')
                   .map(parseOutline),
    };
  }

  const bodyEl = doc.querySelector('body');
  const children = bodyEl
    ? Array.from(bodyEl.children).filter(c => c.tagName === 'outline').map(parseOutline)
    : [];

  return { id: uid(), text: title, note: '', children, collapsed: false };
}

// ─── Zoom / breadcrumb ───────────────────────────────────────────────────────

function zoomInto(id) {
  const node = nodeById(id);
  if (!node) return;
  focusedId = id;
  render();
}

function zoomTo(id) {
  // id=null zooms all the way out to root
  focusedId = id;
  render();
}

function zoomOut() {
  if (!focusedId) return;
  const path = pathTo(focusedId);
  // path[0]=root, path[last]=focused; go up one level (parent, or null for root)
  if (!path || path.length <= 2) {
    focusedId = null;
  } else {
    focusedId = path[path.length - 2].id;
    // don't zoom into root itself
    if (focusedId === root.id) focusedId = null;
  }
  render();
}

function renderBreadcrumb() {
  const bar = document.getElementById('breadcrumb-row');
  if (!focusedId) {
    bar.classList.remove('visible');
    bar.innerHTML = '';
    return;
  }

  const path = pathTo(focusedId) || [];
  bar.innerHTML = '';
  bar.classList.add('visible');

  // "Home" crumb
  const home = document.createElement('span');
  home.className = 'crumb';
  home.textContent = 'Home';
  home.addEventListener('click', () => zoomTo(null));
  bar.appendChild(home);

  // Ancestors (skip root node itself = path[0], skip last = current)
  path.slice(1, -1).forEach(ancestor => {
    const sep = document.createElement('span');
    sep.className = 'crumb-sep';
    sep.textContent = '›';
    bar.appendChild(sep);

    const crumb = document.createElement('span');
    crumb.className = 'crumb';
    crumb.textContent = ancestor.text || '(untitled)';
    crumb.title = ancestor.text;
    crumb.addEventListener('click', () => zoomTo(ancestor.id));
    bar.appendChild(crumb);
  });

  // Current (last in path)
  const current = path[path.length - 1];
  const sep = document.createElement('span');
  sep.className = 'crumb-sep';
  sep.textContent = '›';
  bar.appendChild(sep);

  const curEl = document.createElement('span');
  curEl.className = 'crumb current';
  curEl.textContent = current?.text || '(untitled)';
  bar.appendChild(curEl);
}

// ─── Render ──────────────────────────────────────────────────────────────────

function render() {
  renderBreadcrumb();

  const container = document.getElementById('outline');
  container.innerHTML = '';

  const viewParent = focusedId ? nodeById(focusedId) : root;
  if (!viewParent) { focusedId = null; render(); return; }

  // Zoom title
  if (focusedId) {
    const titleEl = document.createElement('div');
    titleEl.className = 'zoom-title';
    titleEl.contentEditable = 'true';
    titleEl.spellcheck = true;
    titleEl.textContent = viewParent.text;
    titleEl.addEventListener('input', () => {
      viewParent.text = titleEl.textContent;
      markDirty();
      renderBreadcrumb();
    });
    titleEl.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); if (viewParent.children.length) focus(viewParent.children[0].id); }
      if (e.key === 'Escape') { e.preventDefault(); zoomOut(); }
    });
    container.appendChild(titleEl);
  }

  if (viewParent.children.length === 0) {
    addFirstChildTo(viewParent, container);
    return;
  }

  viewParent.children.forEach(child => renderNode(child, container, 0));
}

function addFirstChildTo(parent, container) {
  const newNode = { id: uid(), text: '', note: '', children: [], collapsed: false };
  parent.children.push(newNode);
  markDirty();
  renderNode(newNode, container, 0);
  focus(newNode.id);
}

function renderNode(node, container, depth) {
  const div = document.createElement('div');
  div.className = 'node' +
    (node.children.length ? ' has-children' : '') +
    (node.collapsed ? ' collapsed' : '');
  div.dataset.id = node.id;

  const row = document.createElement('div');
  row.className = 'node-row';

  // collapse triangle
  const colBtn = document.createElement('span');
  colBtn.className = 'collapse-btn';
  colBtn.textContent = node.collapsed ? '▶' : '▼';
  colBtn.title = node.collapsed ? 'Expand' : 'Collapse';
  colBtn.addEventListener('click', () => toggleCollapse(node.id));

  // bullet (click to zoom in)
  const bullet = document.createElement('span');
  bullet.className = 'bullet';
  bullet.title = 'Zoom in';
  bullet.addEventListener('click', () => zoomInto(node.id));

  // editable text
  const content = document.createElement('div');
  content.className = 'node-content';
  content.contentEditable = 'true';
  content.spellcheck = true;
  content.dataset.id = node.id;
  content.dataset.placeholder = depth === 0 && !focusedId ? 'Start writing...' : '';
  content.textContent = node.text;
  content.addEventListener('input', () => {
    node.text = content.textContent;
    markDirty();
  });
  content.addEventListener('keydown', e => onKeyDown(e, node.id));

  row.append(colBtn, bullet, content);
  div.appendChild(row);

  if (node.children.length) {
    const childrenDiv = document.createElement('div');
    childrenDiv.className = 'children';
    node.children.forEach(c => renderNode(c, childrenDiv, depth + 1));
    div.appendChild(childrenDiv);
  }

  container.appendChild(div);
}

// ─── Keyboard handler ─────────────────────────────────────────────────────────

function onKeyDown(e, id) {
  const ctrl = e.ctrlKey || e.metaKey;

  if (e.key === 'Enter' && !e.shiftKey && !ctrl) {
    e.preventDefault(); insertSiblingAfter(id);
  } else if (e.key === 'Enter' && ctrl) {
    e.preventDefault(); zoomInto(id);
  } else if (e.key === 'Tab' && !e.shiftKey) {
    e.preventDefault(); indentNode(id);
  } else if (e.key === 'Tab' && e.shiftKey) {
    e.preventDefault(); outdentNode(id);
  } else if (e.key === 'Backspace') {
    const node = nodeById(id);
    if (node && node.text === '' && node.children.length === 0) {
      e.preventDefault(); deleteNode(id);
    }
  } else if (e.key === 'ArrowUp' && e.altKey) {
    e.preventDefault(); moveNode(id, -1);
  } else if (e.key === 'ArrowDown' && e.altKey) {
    e.preventDefault(); moveNode(id, 1);
  } else if (e.key === 'ArrowUp' && ctrl) {
    e.preventDefault(); setCollapsed(id, true);
  } else if (e.key === 'ArrowDown' && ctrl) {
    e.preventDefault(); setCollapsed(id, false);
  } else if (e.key === 'Escape') {
    e.preventDefault(); zoomOut();
  } else if (e.key === 's' && ctrl) {
    e.preventDefault(); saveFile();
  } else if (e.key === 'o' && ctrl) {
    e.preventDefault(); openFile();
  }
}

// ─── Collapse ────────────────────────────────────────────────────────────────

function setCollapsed(id, val) {
  const node = nodeById(id);
  if (!node) return;
  node.collapsed = val;
  markDirty();
  const el = document.querySelector(`.node[data-id="${id}"]`);
  if (!el) return;
  el.classList.toggle('collapsed', val);
  const btn = el.querySelector(':scope > .node-row > .collapse-btn');
  if (btn) { btn.textContent = val ? '▶' : '▼'; btn.title = val ? 'Expand' : 'Collapse'; }
}

function toggleCollapse(id) {
  const node = nodeById(id);
  if (node) setCollapsed(id, !node.collapsed);
}

// ─── Tree mutations ───────────────────────────────────────────────────────────

function insertSiblingAfter(id) {
  const parent = parentOf(id);
  if (!parent) return;
  // If inserting after the last child of the focused node, stay within view
  const idx = parent.children.findIndex(c => c.id === id);
  const newNode = { id: uid(), text: '', note: '', children: [], collapsed: false };
  parent.children.splice(idx + 1, 0, newNode);
  markDirty();

  const currentEl = document.querySelector(`.node[data-id="${id}"]`);
  if (currentEl) {
    const wrapper = document.createElement('div');
    renderNode(newNode, wrapper, 0);
    currentEl.parentElement.insertBefore(wrapper.firstChild, currentEl.nextSibling);
    focus(newNode.id);
  } else {
    render(); focus(newNode.id);
  }
}

function indentNode(id) {
  const parent = parentOf(id);
  if (!parent) return;
  const idx = parent.children.findIndex(c => c.id === id);
  if (idx === 0) return; // no previous sibling
  const newParent = parent.children[idx - 1];
  const [node] = parent.children.splice(idx, 1);
  newParent.children.push(node);
  if (newParent.collapsed) newParent.collapsed = false;
  markDirty();
  render(); focus(id);
}

function outdentNode(id) {
  const parent = parentOf(id);
  if (!parent || parent === root) return; // already top-level
  // Don't let the node escape the current zoom context
  if (focusedId && parent.id === focusedId) return;
  const grandparent = parentOf(parent.id);
  if (!grandparent) return;
  const idx = parent.children.findIndex(c => c.id === id);
  const [node] = parent.children.splice(idx, 1);
  const parentIdx = grandparent.children.findIndex(c => c.id === parent.id);
  grandparent.children.splice(parentIdx + 1, 0, node);
  markDirty();
  render(); focus(id);
}

function deleteNode(id) {
  const parent = parentOf(id);
  if (!parent) return;
  const idx = parent.children.findIndex(c => c.id === id);
  parent.children.splice(idx, 1);
  markDirty();

  // Decide where to move focus
  let focusTarget = null;
  if (idx > 0) {
    focusTarget = lastVisible(parent.children[idx - 1]).id;
  } else if (parent.id !== root.id && parent.id !== focusedId) {
    focusTarget = parent.id;
  }

  const el = document.querySelector(`.node[data-id="${id}"]`);
  if (el) el.remove();

  // Update parent's has-children class
  if (parent.id !== root.id) {
    const pEl = document.querySelector(`.node[data-id="${parent.id}"]`);
    if (pEl) pEl.classList.toggle('has-children', parent.children.length > 0);
  }

  // If the current view is now empty, add a placeholder
  const viewParent = focusedId ? nodeById(focusedId) : root;
  if (viewParent && viewParent.children.length === 0) {
    const container = document.getElementById('outline');
    // Remove zoom title if present before adding node
    addFirstChildTo(viewParent, container);
  } else if (focusTarget) {
    focus(focusTarget);
  }
}

function lastVisible(node) {
  if (node.collapsed || node.children.length === 0) return node;
  return lastVisible(node.children[node.children.length - 1]);
}

function moveNode(id, dir) {
  const parent = parentOf(id);
  if (!parent) return;
  const idx = parent.children.findIndex(c => c.id === id);
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= parent.children.length) return;
  [parent.children[idx], parent.children[newIdx]] = [parent.children[newIdx], parent.children[idx]];
  markDirty();

  const el = document.querySelector(`.node[data-id="${id}"]`);
  if (el) {
    if (dir === -1) {
      const prev = el.previousElementSibling;
      if (prev) el.parentElement.insertBefore(el, prev);
    } else {
      const next = el.nextElementSibling;
      if (next) el.parentElement.insertBefore(next, el);
    }
    focus(id);
  } else {
    render(); focus(id);
  }
}

function focus(id) {
  requestAnimationFrame(() => {
    const el = document.querySelector(`.node-content[data-id="${id}"]`);
    if (!el) return;
    el.focus();
    const range = document.createRange();
    range.selectNodeContents(el);
    range.collapse(false);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  });
}

// ─── Dirty state ──────────────────────────────────────────────────────────────

function markDirty() {
  dirty = true;
  document.getElementById('toolbar-row').classList.add('dirty');
}

function markClean() {
  dirty = false;
  document.getElementById('toolbar-row').classList.remove('dirty');
}

// ─── File I/O ─────────────────────────────────────────────────────────────────

const hasFileSystemAPI = 'showOpenFilePicker' in window;

const OPML_FILE_TYPE = {
  description: 'OPML outline files',
  accept: { 'text/x-opml': ['.opml'], 'text/xml': ['.opml'] },
};

async function newFile() {
  if (dirty && !confirm('Discard unsaved changes?')) return;
  root = { id: uid(), text: '', note: '', children: [], collapsed: false };
  focusedId = null;
  fileHandle = null;
  fileName = 'unsaved';
  document.getElementById('file-name').textContent = fileName;
  markClean();
  render();
}

async function openFile() {
  if (dirty && !confirm('Discard unsaved changes?')) return;
  if (hasFileSystemAPI) {
    try {
      [fileHandle] = await window.showOpenFilePicker({ types: [OPML_FILE_TYPE] });
      const file = await fileHandle.getFile();
      fileName = file.name;
      root = fromOpml(await file.text());
      focusedId = null;
      document.getElementById('file-name').textContent = fileName;
      markClean();
      render();
    } catch (e) {
      if (e.name !== 'AbortError') alert('Could not open file: ' + e.message);
    }
  } else {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.opml,text/x-opml,application/xml,text/xml';
    input.onchange = async () => {
      const file = input.files[0];
      if (!file) return;
      fileName = file.name;
      try {
        root = fromOpml(await file.text());
        focusedId = null;
        document.getElementById('file-name').textContent = fileName;
        markClean();
        render();
      } catch (e) { alert('Invalid file: ' + e.message); }
    };
    input.click();
  }
}

async function saveFile() {
  if (hasFileSystemAPI) {
    if (fileHandle) await writeToHandle(fileHandle);
    else await saveAsFile();
  } else {
    downloadOpml();
  }
}

async function saveAsFile() {
  if (hasFileSystemAPI) {
    try {
      fileHandle = await window.showSaveFilePicker({
        suggestedName: (fileName === 'unsaved' ? 'outline' : fileName.replace(/\.opml$/i, '')) + '.opml',
        types: [OPML_FILE_TYPE],
      });
      fileName = fileHandle.name;
      document.getElementById('file-name').textContent = fileName;
      await writeToHandle(fileHandle);
    } catch (e) {
      if (e.name !== 'AbortError') alert('Could not save: ' + e.message);
    }
  } else {
    downloadOpml();
  }
}

function downloadOpml() {
  const blob = new Blob([toOpml(root)], { type: 'text/x-opml' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (fileName === 'unsaved' ? 'outline' : fileName.replace(/\.opml$/i, '')) + '.opml';
  a.click();
  URL.revokeObjectURL(url);
  markClean();
}

async function writeToHandle(handle) {
  try {
    const w = await handle.createWritable();
    await w.write(toOpml(root));
    await w.close();
    markClean();
  } catch (e) { alert('Save failed: ' + e.message); }
}

// ─── Boot ─────────────────────────────────────────────────────────────────────

document.getElementById('btn-new').addEventListener('click', newFile);
document.getElementById('btn-open').addEventListener('click', openFile);
document.getElementById('btn-save').addEventListener('click', saveFile);
document.getElementById('btn-save-as').addEventListener('click', saveAsFile);

document.getElementById('shortcuts-toggle').addEventListener('click', () => {
  document.getElementById('shortcuts-panel').classList.toggle('visible');
});
document.getElementById('shortcuts-panel').addEventListener('click', () => {
  document.getElementById('shortcuts-panel').classList.remove('visible');
});

document.addEventListener('keydown', e => {
  const ctrl = e.ctrlKey || e.metaKey;
  if (ctrl && e.key === 's') { e.preventDefault(); saveFile(); }
  if (ctrl && e.key === 'o') { e.preventDefault(); openFile(); }
  if (e.key === 'Escape' && !e.target.closest('.node-content, .zoom-title')) {
    zoomOut();
  }
});

window.addEventListener('beforeunload', e => {
  if (dirty) { e.preventDefault(); e.returnValue = ''; }
});

render();
</script>
</body>
</html>
