<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Pointliner">
  <!-- Editorial ink-on-paper. Maskable-safe: an OPAQUE warm-paper field fills the whole
       canvas (a whisper-warm radial, like a sheet under a desk lamp — never a flashy
       gradient, per design-language.md), and the mark sits inside the ~80% safe zone so
       the OS icon mask (circle/squircle/rounded) never clips it. Warm paper #f7f4ed + ink
       #1f1d1a — the app's own palette tokens; no tech-blue. -->
  <defs>
    <radialGradient id="paper" cx="38%" cy="32%" r="85%">
      <stop offset="0%" stop-color="#faf7f0"/>
      <stop offset="62%" stop-color="#f7f4ed"/>
      <stop offset="100%" stop-color="#f1ece1"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#paper)"/>
  <!-- The Pointliner mark (ring + point + line — a bullet with a line of text), rebuilt as a
       stroked ring + solid dot + solid bar (the in-app .logo-mark is a single compound path
       whose disc swallows the dot/bar under one fill; the explicit shapes read correctly and
       stay crisp at favicon size). Bold weight, tuned for the icon tile. Centered, scale 0.74
       → well inside the 410px safe circle. -->
  <g transform="translate(256 256) scale(0.74) translate(-256 -256)" fill="none">
    <circle cx="256" cy="256" r="224" fill="none" stroke="#1f1d1a" stroke-width="58"/>
    <circle cx="160" cy="256" r="52" fill="#1f1d1a"/>
    <rect x="250" y="224" width="140" height="64" rx="32" fill="#1f1d1a"/>
  </g>
</svg>
