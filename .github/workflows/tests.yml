# Repo path: .github/workflows/tests.yml
#
# Runs the pure-core pins AND the design-language drift guards
# (tests/test.mjs) on every PR and push to main, so the mechanically
# checkable guidance rules (dual-home token parity, radius/weight/size
# floors, the em-dash ban) bind in CI, not only by local convention.

name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Node 22 resolves a bare directory as a module; pass the explicit path.
      - run: node --test tests/test.mjs
      # #1130: the PreToolUse hook has its own self-check, which until now nothing
      # ran. A guard whose test is never executed rots exactly like the guard it
      # tests, so CI runs it. It spawns the hook as a subprocess rather than
      # importing it, which is why it lives beside the hook and not in test.mjs.
      - run: node .claude/hooks/check-pr-conformance.test.mjs
      # #1430: the committed symbol index is a golden file. Regenerating it here and
      # failing on drift is the only thing that stops the map rotting -- the failure
      # mode this repo has now written down twice (#1129 a rule with no reader,
      # #1166 a build script CI never ran). Offline and fast, so it stays on the
      # common path rather than becoming a weekly job nobody watches.
      - run: python3 tools/symbol-index.py --check

  # #1427: the layer tests/test.mjs cannot reach. Its DOM pins prove a handler is
  # PRESENT; #1021 shipped one that was present and inert, because it sat on an
  # element nothing could focus. These six checks drive the real index.html in a
  # real browser and assert on what moved -- where focus went, what the point holds.
  #
  # Playwright is installed here rather than committed: this is a no-build,
  # single-file repo and .gitignore keeps package.json/node_modules out of source
  # deliberately. The cost is that this job needs the network; the node-tests job
  # above does not, and stays the offline gate.
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # --no-save / --no-package-lock: nothing is written back into the tree, so a
      # run cannot leave a package.json behind for someone to commit by accident.
      - run: npm install --no-save --no-package-lock playwright@1.49.1
      - run: npx playwright install --with-deps chromium
      # Without this the job passes on six SKIPS if playwright fails to resolve, which is a green
      # gate that proved nothing -- the exact shape this file exists to catch.
      - run: node --test tests/browser.mjs
        env:
          POINTLINER_REQUIRE_BROWSER: '1'
