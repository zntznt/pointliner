# Repo path: .github/workflows/tests.yml
#
# Runs the pure-core pins AND the design-language drift guards
# (tests/test.mjs) on every PR and push to main, so the mechanically
# checkable guidance rules (dual-home token parity, radius/weight/size
# floors, the em-dash ban) bind in CI, not only by local convention.

name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# TIMEOUTS. Every job here has one, sized as a generous multiple of its measured run. #1465's PR
# is why: the `mutation` runner wedged inside its one step and, with no timeout, sat "in_progress"
# for an hour on a job that finishes in six minutes -- indistinguishable, from the outside, from a
# suite that is simply slow. GitHub's 360-minute default is not a backstop for anything a human is
# waiting on. These bound the WEDGE, not the work: a job that legitimately grows past its number
# should have the number raised, deliberately, in the same change that grew it.

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # measured ~15s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Node 22 resolves a bare directory as a module; pass the explicit path.
      - run: node --test tests/test.mjs

  # #1557: two sub-second, offline checks that share NOTHING with the suite above. They used to be
  # steps 5 and 6 of node-tests, and that is a trap rather than a tidy grouping: when the suite
  # WEDGED on #1557 -- 2049 tests in five seconds, then silence -- timeout-minutes killed the job at
  # ten minutes and GitHub reported both of these `skipped`. The symbol index was in fact STALE on
  # that PR, and nothing said so. A one-second gate was lost to a ten-minute one it has no
  # relationship with, and because a timed-out job is reported `cancelled` rather than `failure`,
  # nothing about the run read as broken either.
  #
  # Splitting them out also means an ordinary red suite no longer hides them: three signals instead
  # of one. Both are offline, so this job keeps node-tests' no-network property.
  drift-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5   # measured ~2s; these read files, they do not run a suite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # #1130: the PreToolUse hook has its own self-check, which until now nothing
      # ran. A guard whose test is never executed rots exactly like the guard it
      # tests, so CI runs it. It spawns the hook as a subprocess rather than
      # importing it, which is why it lives beside the hook and not in test.mjs.
      - run: node .claude/hooks/check-pr-conformance.test.mjs
      # #1430: the committed symbol index is a golden file. Regenerating it here and
      # failing on drift is the only thing that stops the map rotting -- the failure
      # mode this repo has now written down twice (#1129 a rule with no reader,
      # #1166 a build script CI never ran). Offline and fast, so it stays on the
      # common path rather than becoming a weekly job nobody watches.
      #
      # `!cancelled()` because the step above can fail: without it, a broken hook self-check would
      # skip this one and hide the drift, which is the same mistake this job exists to undo, one
      # level down. (Not `always()`, which would also run it on a real cancellation.)
      - if: ${{ !cancelled() }}
        run: python3 tools/symbol-index.py --check

  # A guard that CANNOT FAIL is indistinguishable from a passing guard in every report CI produces,
  # and measured over one session roughly one new guard in six was exactly that -- always the same
  # EXISTENCE shape (a substring of the whole source, an accessible name matched with `includes`,
  # "the menu offered something", a source-ORDER pin). Each was found by hand-mutating the app and
  # watching the guard stay green, which proved it at one instant and then evaporated. This job makes
  # it standing: every mutant in tests/mutants.json is applied and its named guard MUST go red.
  # Each mutant runs ONLY the guard it names (~0.7s); the whole suite runs again only when a mutant
  # looks like it SURVIVED, which is the verdict worth paying for. That is what keeps this on the
  # common path as the registry grows: the first version ran the full suite per mutant, and at ~46
  # mutants that was ~6 minutes, at ~137 it walked into the timeout below and the job was CANCELLED
  # -- a gate that times out has quietly stopped gating. No count is written here; a number in prose
  # cannot be checked, and this one was three times out of date before anybody noticed.
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 25   # measured ~2min for the whole registry, narrowed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/mutation-check.mjs

  # The other half of the staleness guard. tests/test.mjs enforces a floor, but a floor committed in
  # the tree is structurally blind to its own checkout being stale: a base 500 tests old carries the
  # old floor too, compares 1500 against 1400, and passes. That is the documented failure ("it sat at
  # ~1400 while the suite reached 1915"). Seeing it needs a number from OUTSIDE the tree, so this
  # compares the branch against origin/main.
  #
  # The tolerance is a judgment call, not a measurement: a legitimate PR may consolidate a handful of
  # tests, while a stale base is behind by hundreds. 25 sits well clear of both.
  staleness-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # measured ~7s
    steps:
      - uses: actions/checkout@v4
      # No fetch-depth: 0 — the step fetches origin/main shallowly itself, so a full-history
      # clone would buy nothing and cost a slow checkout on every PR.
      - name: compare this branch's test count against origin/main
        run: |
          git fetch origin main --depth=1
          here=$(grep -cE '^\s*test\(' tests/test.mjs)
          main=$(git show origin/main:tests/test.mjs | grep -cE '^\s*test\(')
          echo "this branch: $here declared tests"
          echo "origin/main: $main declared tests"
          if [ "$here" -lt "$((main - 25))" ]; then
            echo "::error::This branch declares $here tests; origin/main has $main. A gap this large"
            echo "::error::means the base is stale, not that tests were consolidated. Fetch and rebase:"
            echo "::error::  git fetch origin && git rebase origin/main"
            exit 1
          fi
          echo "base is current (within tolerance of origin/main)"

  # #1427: the layer tests/test.mjs cannot reach. Its DOM pins prove a handler is
  # PRESENT; #1021 shipped one that was present and inert, because it sat on an
  # element nothing could focus. These six checks drive the real index.html in a
  # real browser and assert on what moved -- where focus went, what the point holds.
  #
  # Playwright is installed here rather than committed: this is a no-build,
  # single-file repo and .gitignore keeps package.json/node_modules out of source
  # deliberately. The cost is that this job needs the network; the node-tests job
  # above does not, and stays the offline gate.
  browser-smoke:
    runs-on: ubuntu-latest
    # #1572: the estimate this carried ("~7min, 40 driven checks") described a suite that has since
    # doubled to 91 checks; measured 13min on a healthy runner and 17min on a slow one, so 25 left
    # under 1.5x headroom on a bad day and a run has already been killed by it. Raised, and the
    # number now says what it counted so the next person can tell whether it has drifted again.
    timeout-minutes: 40   # measured ~13min healthy / ~17min slow (install + 91 driven checks)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # --no-save / --no-package-lock: nothing is written back into the tree, so a
      # run cannot leave a package.json behind for someone to commit by accident.
      - run: npm install --no-save --no-package-lock playwright@1.49.1
      - run: npx playwright install --with-deps chromium
      # Without this the job passes on six SKIPS if playwright fails to resolve, which is a green
      # gate that proved nothing -- the exact shape this file exists to catch.
      - run: node --test tests/browser.mjs
        env:
          POINTLINER_REQUIRE_BROWSER: '1'
