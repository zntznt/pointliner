# Repo path: .github/workflows/ux-conformance.yml
#
# Fails any PR whose description lacks a filled UX Conformance Statement
# (or an explicit "UI: none"). This enforces presence + shape only — a human/agent
# reviewer still checks the statement is TRUE against the diff (see the PR template's
# reviewer checklist). Full process: guidance/ux-definition-of-done.md.

name: UX Conformance Gate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read
  contents: read

jobs:
  ux-conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Require a UX Conformance Statement in the PR body
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = (pr && pr.body) ? pr.body : '';

            const fail = (msg) => core.setFailed(
              `UX Conformance gate failed.\n\n${msg}\n\n` +
              `Every UI-touching PR must include a filled UX Conformance Statement ` +
              `(guidance/ux-definition-of-done.md -> "How this gate is run"), or "UI: none" ` +
              `if the change has no UI surface. No statement, no merge.`
            );

            // Escape hatch: pure logic / core-only change with no UI surface.
            if (/(^|\n)\s*UI:\s*none\b/i.test(body)) {
              core.info('UI: none declared — UX Conformance not required.');
              return;
            }

            // 1. The block must exist.
            if (!/UX Conformance/i.test(body)) {
              return fail('No "UX Conformance" block found in the PR description.');
            }

            // 2. The skeleton must be filled (no leftover placeholders).
            const placeholders = body.match(/<how>|<change>|<one-word reason>/gi);
            if (placeholders) {
              return fail(
                `The statement still has ${placeholders.length} unfilled placeholder(s) ` +
                `(e.g. "<how>"). Fill every principle line.`
              );
            }

            // 3. Each principle must carry a verdict (✅ or N/A).
            const verdict = /(✅|N\/?-?A)/i;
            const lines = body.split('\n');
            const missing = ['P1', 'P2', 'P3', 'P4', 'P5'].filter(p => {
              const line = lines.find(l => new RegExp(`\\b${p}\\b`).test(l) && verdict.test(l));
              return !line;
            });
            if (missing.length) {
              return fail(`No ✅ / N/A verdict found for: ${missing.join(', ')}.`);
            }

            core.info('UX Conformance Statement present and filled. ✓');

  # ---------------------------------------------------------------------------
  # CLAUDE.md -> "PR/commit hygiene: No agent attribution or session links."
  # That rule existed and was still broken across eight consecutive merged commits,
  # because nothing read commit messages: the only other gate checks the PR BODY,
  # and the written procedure only described stripping an auto-appended link from
  # the PR. An author writing the trailer into the commit was an unguarded surface.
  # This job reads both surfaces so the rule binds instead of relying on discipline.
  commit-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: No agent attribution or session links in commits or the PR body
        uses: actions/github-script@v7
        with:
          script: |
            // BANNED_PATTERNS - kept on one line each, in this exact shape, because
            // tests/test.mjs parses them out of this file and runs them against real
            // sample messages. A guard nobody can prove is a guard nobody should trust.
            // Two classes, because they fail in opposite directions.
            //
            // ANYWHERE: a session URL or an attribution footer is never legitimate prose. The
            // platform APPENDS `_Generated by [Claude Code](https://claude.ai/code/session_...)_`
            // to a PR body after creation -- that is real, it is what CLAUDE.md's "auto-appended"
            // note always described, and the first version of this guard sailed straight past it
            // twice: the footer says "Generated BY" (the pattern said "with") and the URL sits
            // mid-line (the body check only looked at line starts). Fixing a false positive had
            // created a false negative for the exact thing the guard exists to catch.
            // Discussion of these still works, because fenced and inline code are stripped first.
            const BANNED_ANYWHERE = [
              { re: /claude\.ai\/code\/session/i,           why: 'a claude.ai session link' },
              { re: /Generated (?:with|by) .{0,20}Claude Code/i, why: 'a "Generated by Claude Code" attribution' },
              { re: /\u{1F916}\s*Generated/iu,               why: 'a robot-emoji attribution line' },
            ];
            // LINE START ONLY: trailer-shaped, and plausibly named mid-sentence in prose about the
            // rule ("the commits carried Claude-Session trailers"), so these need the anchor.
            const BANNED_TRAILER = [
              { re: /Claude-Session/i,          why: 'a Claude-Session trailer' },
              { re: /Co-Authored-By:.*Claude/i, why: 'Claude listed as a co-author' },
            ];
            const BANNED = [...BANNED_ANYWHERE, ...BANNED_TRAILER];
            const pr = context.payload.pull_request;
            const bad = [];
            // A COMMIT is checked whole: a session link anywhere in one is a violation, full stop.
            const checkCommit = (where, text) => {
              for (const b of BANNED) if (b.re.test(text || '')) bad.push(`${where}: ${b.why}`);
            };
            // A PR BODY is prose ABOUT the codebase and legitimately quotes things. This guard's
            // own first PR described the banned trailers in order to explain the bug, and the first
            // draft of this job failed it for doing so -- the commit was clean and the description
            // was the only offender. Matching raw text cannot tell a violation from a DISCUSSION of
            // one; that is the same defect as the PR-conformance hook in #1130, which blocks a
            // shell command for merely quoting a command name inside a doc string.
            // So: drop fenced blocks and inline code, then require a real trailer at LINE START.
            const checkBody = (text) => {
              const prose = String(text || '')
                .replace(/```[\s\S]*?```/g, '')
                .replace(/`[^`\n]*`/g, '');
              for (const b of BANNED_ANYWHERE) {
                if (b.re.test(prose)) bad.push(`PR body: ${b.why}`);
              }
              for (const b of BANNED_TRAILER) {
                const anchored = new RegExp('^[ \\t>]*(?:' + b.re.source + ')', 'im');
                if (anchored.test(prose)) bad.push(`PR body: ${b.why}`);
              }
            };
            checkBody(pr && pr.body);
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number,
            });
            for (const c of commits) {
              checkCommit(`commit ${c.sha.slice(0, 7)}`, c.commit.message);
            }
            if (bad.length) {
              core.setFailed(
                `Commit hygiene gate failed.\n\n${bad.map(b => '  - ' + b).join('\n')}\n\n` +
                `CLAUDE.md ("PR/commit hygiene") bans agent attribution and session links in ` +
                `BOTH commit messages and the PR description. Reword the commit (git rebase -i, ` +
                `or amend if it is the tip) and edit the PR body, then push again.`
              );
            }
            core.info(`Commit hygiene clean across ${commits.length} commit(s). ✓`);
